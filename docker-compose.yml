services:
  app1:
    build: .
    environment:
      VCF_DATA_DIR: /data
      # Both containers deliberately share one VCF_INSTANCE_ID — this is the
      # rolling-replacement overlap window (old and new processes serving at
      # once). Ownership is keyed per process boot, so concurrent uploads,
      # pins and shutdowns stay isolated. Replace one container at a time
      # (e.g. `docker compose up -d --no-deps --build app1`) to rehearse the
      # handover against a live peer.
      VCF_INSTANCE_ID: vcf
    volumes:
      - vcfdata:/data
    ports:
      - "8001:8000"

  app2:
    build: .
    environment:
      VCF_DATA_DIR: /data
      VCF_INSTANCE_ID: vcf
    volumes:
      - vcfdata:/data
    ports:
      - "8002:8000"

volumes:
  vcfdata:
